<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeoAstra Hello</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Hello from <span>NeoAstra</span></h1>
    <p>Call a source-generated C# RPC method from the page.</p>
    <form id="greeting-form">
      <label for="name">Your name</label>
      <input id="name" value="mobile developer">
      <button>Greet</button>
    </form>
    <p id="result" aria-live="polite">Ready to call the native host.</p>
    <nav>
      <a id="external" href="https://github.com/NeoAstra">NeoAstra on GitHub</a>
      <a id="external-window" href="https://github.com/NeoAstra" target="_blank">in a new window</a>
      <a id="blocked" href="https://example.com/">a page the application does not allow</a>
    </nav>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
