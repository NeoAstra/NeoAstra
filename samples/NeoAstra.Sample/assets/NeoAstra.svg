<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="32 32 448 448" role="img" aria-labelledby="title description">
  <title id="title">NeoAstra logo</title>
  <desc id="description">A bright orange N surrounded by blue orbital rings and orange stars.</desc>

  <defs>
    <linearGradient id="orbitBlue" x1="65" y1="95" x2="452" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CEBFF"/>
      <stop offset="0.42" stop-color="#25B9F2"/>
      <stop offset="1" stop-color="#3268DC"/>
    </linearGradient>
    <linearGradient id="neoOrange" x1="157" y1="146" x2="359" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0A3"/>
      <stop offset="0.22" stop-color="#FFC247"/>
      <stop offset="0.58" stop-color="#FF7A24"/>
      <stop offset="1" stop-color="#F04424"/>
    </linearGradient>
    <linearGradient id="starOrange" x1="365" y1="74" x2="413" y2="137" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE18A"/>
      <stop offset="0.45" stop-color="#FFAD3D"/>
      <stop offset="1" stop-color="#F45B27"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#45CFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#258DDC" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#173E83" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06152D" flood-opacity="0.30"/>
    </filter>
    <filter id="neoGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#FF7428" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#06152D" flood-opacity="0.42"/>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.10  0 0.58 0 0 0.10  0 0 0.18 0 0  0 0 0 0.38 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The artwork intentionally has no background so it can sit on light or dark themes. -->
  <circle cx="256" cy="256" r="178" fill="url(#coreGlow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <!-- Dark keylines keep the blue orbits legible on light backgrounds. -->
    <ellipse cx="256" cy="256" rx="205" ry="100" transform="rotate(-14 256 256)" stroke="#092348" stroke-opacity="0.78" stroke-width="25"/>
    <ellipse cx="256" cy="256" rx="209" ry="91" transform="rotate(68 256 256)" stroke="#092348" stroke-opacity="0.78" stroke-width="25"/>

    <ellipse cx="256" cy="256" rx="205" ry="100" transform="rotate(-14 256 256)" stroke="url(#orbitBlue)" stroke-width="14"/>
    <ellipse cx="256" cy="256" rx="209" ry="91" transform="rotate(68 256 256)" stroke="url(#orbitBlue)" stroke-width="14"/>

    <!-- Fine highlights retain definition against dark backgrounds. -->
    <ellipse cx="256" cy="256" rx="205" ry="100" transform="rotate(-14 256 256)" stroke="#C8F8FF" stroke-opacity="0.48" stroke-width="2.5"/>
    <ellipse cx="256" cy="256" rx="209" ry="91" transform="rotate(68 256 256)" stroke="#C8F8FF" stroke-opacity="0.42" stroke-width="2.5"/>
  </g>

  <!-- A bold, chamfered ribbon gives NeoAstra a distinctive warm N monogram. -->
  <g stroke-linejoin="round" filter="url(#neoGlow)">
    <path d="M150 352V160Q150 146 164 146H188L324 291V160Q324 146 338 146H352Q366 146 366 160V352Q366 366 352 366H330L192 220V352Q192 366 178 366H164Q150 366 150 352Z" fill="#071D3D" stroke="#071D3D" stroke-opacity="0.94" stroke-width="24"/>
    <path d="M150 352V160Q150 146 164 146H188L324 291V160Q324 146 338 146H352Q366 146 366 160V352Q366 366 352 366H330L192 220V352Q192 366 178 366H164Q150 366 150 352Z" fill="url(#neoOrange)"/>
    <path d="M150 352V160Q150 146 164 146H188L324 291V160Q324 146 338 146H352Q366 146 366 160V352Q366 366 352 366H330L192 220V352Q192 366 178 366H164Q150 366 150 352Z" fill="none" stroke="#FFF6D5" stroke-opacity="0.38" stroke-width="3"/>
  </g>

  <!-- Warm stars make the astral theme readable without depending on the background. -->
  <g filter="url(#starGlow)">
    <path d="M390 66C394 87 402 97 425 102C402 107 394 117 390 140C386 117 378 107 355 102C378 97 386 87 390 66Z" fill="#0A2242" stroke="#0A2242" stroke-width="12" stroke-linejoin="round"/>
    <path d="M390 66C394 87 402 97 425 102C402 107 394 117 390 140C386 117 378 107 355 102C378 97 386 87 390 66Z" fill="url(#starOrange)"/>
    <circle cx="383" cy="94" r="5" fill="#FFF1B8" fill-opacity="0.88"/>
  </g>

  <g fill="#0A2242" stroke="#0A2242" stroke-linejoin="round">
    <path d="M77 258C79 269 84 274 95 276C84 278 79 283 77 294C75 283 70 278 59 276C70 274 75 269 77 258Z" stroke-width="9"/>
    <path d="M303 423C305 433 309 437 320 440C309 442 305 447 303 457C301 447 297 442 286 440C297 437 301 433 303 423Z" stroke-width="8"/>
    <circle cx="431" cy="326" r="12" stroke-width="8"/>
  </g>
  <g fill="#FF9A32">
    <path d="M77 258C79 269 84 274 95 276C84 278 79 283 77 294C75 283 70 278 59 276C70 274 75 269 77 258Z"/>
    <path d="M303 423C305 433 309 437 320 440C309 442 305 447 303 457C301 447 297 442 286 440C297 437 301 433 303 423Z"/>
    <circle cx="431" cy="326" r="12"/>
  </g>
  <circle cx="427" cy="322" r="3.5" fill="#FFE9A5" fill-opacity="0.85"/>
</svg>
