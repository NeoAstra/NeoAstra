<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoWebView local application</title>
  <style>
    body { color-scheme: light dark; font: 16px system-ui; margin: 3rem; }
    code { display: block; margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>NeoWebView local application</h1>
  <p>This page is served from <strong>app://neowebview</strong>, without localhost.</p>
  <button id="send" type="button">Send another message to C#</button>
  <code id="received">Waiting for C#…</code>
  <script>
    const bridge = window.chrome.webview;
    window.neoWebView = { postMessage: value => bridge.postMessage(value) };
    bridge.addEventListener('message', event => {
      document.querySelector('#received').textContent = JSON.stringify(event.data, null, 2);
    });
    const send = () => window.neoWebView.postMessage({ from: 'JavaScript', message: 'Hello from app://neowebview' });
    document.querySelector('#send').addEventListener('click', send);
    send();
  </script>
</body>
</html>
