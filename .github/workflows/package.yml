name: package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml

  package:
    name: Package native runtimes
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            samples/NeoAstra.Sample.Advanced/frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoAstra.Core/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoAstra.Core/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoAstra.Core/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoAstra.Core/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoAstra.Core/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoAstra.Core/runtimes/osx-arm64/native
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoAstra.slnx
          dotnet build src/NeoAstra.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet pack src/NeoAstra.Core/NeoAstra.Core.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra/NeoAstra.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Tool/NeoAstra.Tool.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Templates/NeoAstra.Templates.csproj -c Release --no-build -o artifacts/packages
          dotnet publish samples/NeoAstra.Core.Sample/NeoAstra.Core.Sample.csproj -c Release -r win-x64 --self-contained -o artifacts/nativeaot
          & artifacts/nativeaot/NeoAstra.Core.Sample.exe --validate-native-library
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimePackages = @(Get-ChildItem artifacts/packages/*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Tool.*' -and $_.Name -notlike 'NeoAstra.Templates.*' })
          if ($runtimePackages.Count -ne 2) { throw "Expected exactly NeoAstra and NeoAstra.Core runtime packages; found $($runtimePackages.Name -join ', ')" }
          $corePackage = Get-ChildItem artifacts/packages/NeoAstra.Core.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $coreArchive = [IO.Compression.ZipFile]::OpenRead($corePackage.FullName)
          $coreEntries = $coreArchive.Entries.FullName
          $coreArchive.Dispose()
          @(
            'license.txt',
            'THIRD-PARTY-NOTICES.md',
            'docs/platform-support.md',
            'docs/known-limitations.md',
            'docs/frontend-transport.md',
            'lib/net10.0/NeoAstra.Core.dll',
            'build/native/include/neoastra.h',
            'build/native/include/neoastra_version.h',
            'runtimes/win-x64/native/neoastra_native.dll',
            'runtimes/win-arm64/native/neoastra_native.dll',
            'runtimes/linux-x64/native/libneoastra_native.so',
            'runtimes/linux-arm64/native/libneoastra_native.so',
            'runtimes/osx-x64/native/libneoastra_native.dylib',
            'runtimes/osx-arm64/native/libneoastra_native.dylib'
          ) | ForEach-Object { if ($_ -notin $coreEntries) { throw "Missing Core package asset: $_" } }
          $package = Get-ChildItem artifacts/packages/NeoAstra.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Core.*' -and $_.Name -notlike 'NeoAstra.Tool.*' -and $_.Name -notlike 'NeoAstra.Templates.*' } | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @('lib/net10.0/NeoAstra.dll', 'analyzers/dotnet/cs/NeoAstra.Generator.dll', 'buildTransitive/NeoAstra.props', 'buildTransitive/NeoAstra.targets', 'tools/net10.0/any/NeoAstra.Tool.dll', 'tools/frontend/neoastra-client/package.json', 'tools/frontend/neoastra-client/dist/index.js', 'docs/rpc-and-bindings.md', 'docs/desktop-services.md', 'plugins/neoastra.desktop.essentials/neoastra.plugin.json', 'schemas/neoastra-capabilities-v1.schema.json') | ForEach-Object { if ($_ -notin $entries) { throw "Missing NeoAstra package asset: $_" } }
          $frontendToolPackage = Get-ChildItem artifacts/packages/NeoAstra.Tool.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $frontendToolArchive = [IO.Compression.ZipFile]::OpenRead($frontendToolPackage.FullName)
          $frontendToolEntries = $frontendToolArchive.Entries.FullName
          $frontendToolArchive.Dispose()
          @('tools/net10.0/any/NeoAstra.Tool.dll', 'tools/net10.0/any/DotnetToolSettings.xml', 'schemas/neoastra-project-v1.schema.json', 'schemas/neoastra-staging-manifest-v1.schema.json', 'schemas/neoastra-update-manifest-v1.schema.json', 'delivery-and-updates.md') | ForEach-Object { if ($_ -notin $frontendToolEntries) { throw "Missing frontend tool package asset: $_" } }
          if ($frontendToolEntries | Where-Object { $_ -match '(?:^|/)(?:lib)?neoastra[_-]native(?:\.|/)' }) { throw 'NeoAstra.Tool must not duplicate native runtime assets' }
          $templatePackage = Get-ChildItem artifacts/packages/NeoAstra.Templates.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          if ($null -eq $templatePackage) { throw 'Missing template package' }
          $templateArchive = [IO.Compression.ZipFile]::OpenRead($templatePackage.FullName)
          $templateEntries = $templateArchive.Entries.FullName
          $templateArchive.Dispose()
          @('content/neoastra-vanilla/.template.config/template.json', 'content/neoastra-react/.template.config/template.json', 'content/neoastra-vue/.template.config/template.json') | ForEach-Object { if ($_ -notin $templateEntries) { throw "Missing template package asset: $_" } }
      - name: Verify one-reference package consumer
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/packages/NeoAstra.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Core.*' -and $_.Name -notlike 'NeoAstra.Tool.*' -and $_.Name -notlike 'NeoAstra.Templates.*' } | Select-Object -First 1
          $version = $package.BaseName.Substring('NeoAstra.'.Length)
          $consumer = Join-Path $PWD artifacts/package-consumer
          New-Item -ItemType Directory -Force $consumer | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup>
            <ItemGroup><PackageReference Include="NeoAstra" Version="$version" /></ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $consumer Consumer.csproj)
          Copy-Item samples/NeoAstra.Sample/Program.cs (Join-Path $consumer Program.cs)
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /><add key="local" value="$PWD/artifacts/packages" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          "@ | Set-Content (Join-Path $consumer NuGet.config)
          dotnet restore (Join-Path $consumer Consumer.csproj) --configfile (Join-Path $consumer NuGet.config)
          dotnet build (Join-Path $consumer Consumer.csproj) -c Release --no-restore
          @('neoastra.ts', 'neoastra.manifest.json', 'neoastra.schema.json') | ForEach-Object {
            if (-not (Test-Path (Join-Path $consumer "obj/neoastra/$_"))) { throw "Intermediate generator output is missing: $_" }
            if (-not (Test-Path (Join-Path $consumer "bin/Release/net10.0/neoastra/$_"))) { throw "Generator output content is missing: $_" }
          }
          if (Select-String -Path (Join-Path $consumer obj/project.assets.json) -Pattern 'NeoAstra.Generator/' -Quiet) { throw 'Generator must be an analyzer asset, not a package dependency' }
      - name: Verify clean application templates
        shell: pwsh
        run: |
          $runtimePackage = Get-ChildItem artifacts/packages/NeoAstra.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Core.*' -and $_.Name -notlike 'NeoAstra.Tool.*' -and $_.Name -notlike 'NeoAstra.Templates.*' } | Select-Object -First 1
          $version = $runtimePackage.BaseName.Substring('NeoAstra.'.Length)
          $templatePackage = Get-ChildItem artifacts/packages/NeoAstra.Templates.*.nupkg | Select-Object -First 1
          $root = Join-Path $PWD artifacts/template-consumers
          $hive = Join-Path $root hive
          dotnet new install $templatePackage.FullName --debug:custom-hive $hive
          dotnet new neoastra -n VanillaApp -o (Join-Path $root VanillaApp) --neoAstraVersion $version --debug:custom-hive $hive
          dotnet new neoastra-react -n ReactApp -o (Join-Path $root ReactApp) --neoAstraVersion $version --debug:custom-hive $hive
          dotnet new neoastra-vue -n VueApp -o (Join-Path $root VueApp) --neoAstraVersion $version --debug:custom-hive $hive
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /><add key="local" value="$PWD/artifacts/packages" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          "@ | Set-Content (Join-Path $root NuGet.config)
          foreach ($name in @('VanillaApp', 'ReactApp', 'VueApp')) {
            $project = Get-ChildItem (Join-Path $root $name) -Filter *.csproj | Select-Object -First 1
            if ((Select-String -Path $project.FullName -Pattern '<PackageReference').Count -ne 1) { throw "$name must contain one package reference" }
            if (Test-Path (Join-Path $project.DirectoryName neoastra.json)) { throw "$name must use convention-based defaults" }
            dotnet restore $project.FullName --configfile (Join-Path $root NuGet.config)
            dotnet build $project.FullName -c Release --no-restore
          }
      - name: Verify managed Source Link
        shell: pwsh
        run: |
          $symbolPackages = @(Get-ChildItem artifacts/packages/*.snupkg)
          if ($symbolPackages.Count -lt 2) { throw "Expected Core and full managed symbol packages; found $($symbolPackages.Count)" }
          $commit = git rev-parse HEAD
          foreach ($symbolPackage in $symbolPackages) {
            & eng/verify_sourcelink.ps1 -SymbolPackage $symbolPackage.FullName -Repository NeoAstra/NeoAstra -Commit $commit
          }
      - name: Generate package checksums
        run: |
          python -m unittest eng.tests.test_release_readiness
          python eng/release_readiness.py checksums --directory artifacts/packages
      - name: Upload package and release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.*nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
