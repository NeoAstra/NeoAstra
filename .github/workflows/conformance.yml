name: conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml

  desktop-conformance:
    name: Desktop-session conformance (${{ matrix.rid }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            library: neoastra_native.dll
          - os: macos-15-intel
            rid: osx-x64
            library: libneoastra_native.dylib
          - os: ubuntu-latest
            rid: linux-x64
            library: libneoastra_native.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/desktop-native
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
      - name: Run desktop session smoke fixture
        shell: bash
        run: |
          export NEOASTRA_NATIVE_LIBRARY="$PWD/artifacts/desktop-native/${{ matrix.library }}"
          command=(dotnet run --project src/NeoAstra.NativeAotFixture/NeoAstra.NativeAotFixture.csproj -c Release -- --native-smoke)
          if [[ "${{ runner.os }}" == "Linux" ]]; then xvfb-run -a "${command[@]}"; else "${command[@]}"; fi
