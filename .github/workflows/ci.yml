name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            samples/NeoAstra.Sample.Advanced/frontend/package-lock.json
      - name: Build solution
        run: dotnet build src/NeoAstra.slnx -c Release -p:ContinuousIntegrationBuild=true
      - name: Test solution
        run: dotnet test src/NeoAstra.slnx -c Release --no-build --no-restore

  release:
    name: Build, test, pack, and publish (Windows)
    needs: managed
    permissions:
      id-token: write
      actions: write
      contents: write
    runs-on: windows-latest
    steps:
      - name: Build, Test, Pack and Publish
        uses: xoofx/.github/.github/actions/dotnet-releaser-action@main
