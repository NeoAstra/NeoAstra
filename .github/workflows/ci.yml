name: ci

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml

  managed:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test release-readiness tooling
        run: python -m unittest discover -s eng/tests -v
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            samples/NeoAstra.Sample.Advanced/frontend/package-lock.json
      - name: Build solution
        run: dotnet build src/NeoAstra.slnx -c Release -p:ContinuousIntegrationBuild=true
      - name: Test solution
        run: dotnet test src/NeoAstra.slnx -c Release --no-build --no-restore

  release:
    name: Build, test, pack, and publish (Windows)
    needs: [managed, native]
    permissions:
      id-token: write
      actions: write
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test release-readiness tooling
        run: python -m unittest discover -s eng/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            samples/NeoAstra.Sample.Advanced/frontend/package-lock.json
      # Pair managed code with this commit's native libraries, not checked-in binaries.
      # Stage every packaged RID before the releaser evaluates MSBuild native item globs.
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoAstra.Core/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoAstra.Core/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoAstra.Core/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoAstra.Core/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoAstra.Core/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoAstra.Core/runtimes/osx-arm64/native
      # Default `run` mode builds/tests/packs on PRs and branches, and publishes on release tag pushes.
      - name: Build, Test, Pack and Publish
        uses: xoofx/.github/.github/actions/dotnet-releaser-action@main
        with:
          checkout-repo: 'false'
