name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed:
    name: Managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/NeoWebView.slnx
      - name: Verify generated interop
        shell: bash
        run: |
          dotnet run --project src/NeoWebView.CodeGen/NeoWebView.CodeGen.csproj -c Release --no-restore
          git diff --exit-code -- src/NeoWebView/Generated/Interop/NativeMethods.Generated.cs
      - name: Build
        run: dotnet build src/NeoWebView.slnx -c Release --no-restore
      - name: Verify opt-in harness defaults
        run: |
          dotnet run --project src/NeoWebView.Conformance/NeoWebView.Conformance.csproj -c Release --no-build
          dotnet run --project src/NeoWebView.Benchmarks/NeoWebView.Benchmarks.csproj -c Release --no-build
      - name: Test
        run: dotnet test src/NeoWebView.slnx -c Release --no-build
      - name: Publish NativeAOT sample
        run: dotnet publish samples/NeoWebView.Sample/NeoWebView.Sample.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/nativeaot

  native:
    uses: ./.github/workflows/native.yml

  package:
    name: Package native runtimes
    needs: [managed, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoWebView/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoWebView/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoWebView/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoWebView/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoWebView/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoWebView/runtimes/osx-arm64/native
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoWebView.slnx
          dotnet build src/NeoWebView.slnx -c Release --no-restore
          dotnet pack src/NeoWebView/NeoWebView.csproj -c Release --no-build -o artifacts/packages
          dotnet publish samples/NeoWebView.Sample/NeoWebView.Sample.csproj -c Release -r win-x64 --self-contained -o artifacts/nativeaot
          & artifacts/nativeaot/NeoWebView.Sample.exe --validate-native-library
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @(
            'license.txt',
            'THIRD-PARTY-NOTICES.md',
            'docs/platform-support.md',
            'docs/known-limitations.md',
            'build/native/include/neowebview.h',
            'build/native/include/neowebview_version.h',
            'runtimes/win-x64/native/neowebview_native.dll',
            'runtimes/win-arm64/native/neowebview_native.dll',
            'runtimes/linux-x64/native/libneowebview_native.so',
            'runtimes/linux-arm64/native/libneowebview_native.so',
            'runtimes/osx-x64/native/libneowebview_native.dylib',
            'runtimes/osx-arm64/native/libneowebview_native.dylib'
          ) | ForEach-Object { if ($_ -notin $entries) { throw "Missing package asset: $_" } }
          $symbolPackage = Get-ChildItem artifacts/packages/*.snupkg | Select-Object -First 1
          if ($null -eq $symbolPackage) { throw 'Missing managed symbol package' }
          $symbolArchive = [IO.Compression.ZipFile]::OpenRead($symbolPackage.FullName)
          $symbolEntries = $symbolArchive.Entries.FullName
          $symbolArchive.Dispose()
          if ('lib/net10.0/NeoWebView.pdb' -notin $symbolEntries) { throw 'Missing managed symbols' }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
