name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend package and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: Verify generated embedded client assets
        run: git diff --exit-code -- samples/NeoAstra.Sample/assets/neoastra-client src/NeoAstra.Conformance/assets/neoastra-client src/NeoAstra.Benchmarks/assets/neoastra-client

  managed:
    name: Managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/NeoAstra.slnx
      - name: Verify generated interop
        shell: bash
        run: |
          dotnet run --project src/NeoAstra.CodeGen/NeoAstra.CodeGen.csproj -c Release --no-restore
          git diff --exit-code -- src/NeoAstra/Generated/Interop/NativeMethods.Generated.cs
      - name: Build
        run: dotnet build src/NeoAstra.slnx -c Release --no-restore
      - name: Verify capability schema and deterministic manifests
        shell: bash
        run: |
          mkdir -p artifacts/capabilities
          for platform in windows macos linux; do
            dotnet run --project src/NeoAstra.Capabilities.Tool/NeoAstra.Capabilities.Tool.csproj -c Release --no-build -- resolve --capabilities src/NeoAstra.Tests/Fixtures/Capabilities/capabilities.json --catalog src/NeoAstra.Tests/Fixtures/Capabilities/catalog.json --platform "$platform" --configuration Release "artifacts/capabilities/$platform.first.json"
            dotnet run --project src/NeoAstra.Capabilities.Tool/NeoAstra.Capabilities.Tool.csproj -c Release --no-build -- resolve --capabilities src/NeoAstra.Tests/Fixtures/Capabilities/capabilities.json --catalog src/NeoAstra.Tests/Fixtures/Capabilities/catalog.json --platform "$platform" --configuration Release "artifacts/capabilities/$platform.second.json"
            cmp "artifacts/capabilities/$platform.first.json" "artifacts/capabilities/$platform.second.json"
          done
      - name: Verify opt-in harness defaults
        run: |
          dotnet run --project src/NeoAstra.Conformance/NeoAstra.Conformance.csproj -c Release --no-build
          dotnet run --project src/NeoAstra.Benchmarks/NeoAstra.Benchmarks.csproj -c Release --no-build
      - name: Test
        run: dotnet test src/NeoAstra.slnx -c Release --no-build
      - name: Publish and execute RPC NativeAOT fixture
        shell: bash
        run: |
          dotnet publish src/NeoAstra.Rpc.NativeAotFixture/NeoAstra.Rpc.NativeAotFixture.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/rpc-nativeaot
          ./artifacts/rpc-nativeaot/NeoAstra.Rpc.NativeAotFixture${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          git diff --exit-code -- src/NeoAstra.Rpc.NativeAotFixture/generated
          cmp src/NeoAstra.Rpc.NativeAotFixture/generated/neoastra.ts frontend/fixtures/generated/neoastra.ts
      - name: Publish NativeAOT sample
        run: dotnet publish samples/NeoAstra.Sample/NeoAstra.Sample.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/nativeaot
      - name: Inspect and publish v2 reference assets under NativeAOT
        shell: bash
        run: |
          dotnet run --project src/NeoAstra.Tool/NeoAstra.Tool.csproj -c Release --no-build -- inspect --config samples/NeoAstra.V2.Reference/neoastra.json > artifacts/reference-inspect.json
          dotnet publish samples/NeoAstra.V2.Reference/NeoAstra.V2.Reference.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/v2-reference
          ./artifacts/v2-reference/NeoAstra.V2.Reference${{ matrix.os == 'windows-latest' && '.exe' || '' }} --validate-reference
          git diff --exit-code -- samples/NeoAstra.V2.Reference/generated samples/NeoAstra.V2.Reference/ClientApp/src/generated

  native:
    uses: ./.github/workflows/native.yml

  package:
    name: Package native runtimes
    needs: [managed, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoAstra/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoAstra/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoAstra/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoAstra/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoAstra/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoAstra/runtimes/osx-arm64/native
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoAstra.slnx
          dotnet build src/NeoAstra.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet pack src/NeoAstra/NeoAstra.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Rpc/NeoAstra.Rpc.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Rpc.Generator/NeoAstra.Rpc.Generator.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Capabilities.Tool/NeoAstra.Capabilities.Tool.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Tool/NeoAstra.Tool.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Sdk/NeoAstra.Sdk.csproj -c Release --no-build -o artifacts/packages
          dotnet pack src/NeoAstra.Templates/NeoAstra.Templates.csproj -c Release --no-build -o artifacts/packages
          dotnet publish samples/NeoAstra.Sample/NeoAstra.Sample.csproj -c Release -r win-x64 --self-contained -o artifacts/nativeaot
          & artifacts/nativeaot/NeoAstra.Sample.exe --validate-native-library
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/NeoAstra.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Rpc*' } | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @(
            'license.txt',
            'THIRD-PARTY-NOTICES.md',
            'docs/platform-support.md',
            'docs/known-limitations.md',
             'docs/frontend-transport.md',
             'docs/rpc-and-bindings.md',
            'build/native/include/neoastra.h',
            'build/native/include/neoastra_version.h',
            'runtimes/win-x64/native/neoastra_native.dll',
            'runtimes/win-arm64/native/neoastra_native.dll',
            'runtimes/linux-x64/native/libneoastra_native.so',
            'runtimes/linux-arm64/native/libneoastra_native.so',
            'runtimes/osx-x64/native/libneoastra_native.dylib',
            'runtimes/osx-arm64/native/libneoastra_native.dylib'
          ) | ForEach-Object { if ($_ -notin $entries) { throw "Missing package asset: $_" } }
          $symbolPackage = Get-ChildItem artifacts/packages/*.snupkg | Select-Object -First 1
          if ($null -eq $symbolPackage) { throw 'Missing managed symbol package' }
          $symbolArchive = [IO.Compression.ZipFile]::OpenRead($symbolPackage.FullName)
          $symbolEntries = $symbolArchive.Entries.FullName
          $symbolArchive.Dispose()
          if ('lib/net10.0/NeoAstra.pdb' -notin $symbolEntries) { throw 'Missing managed symbols' }
          $rpcPackage = Get-ChildItem artifacts/packages/NeoAstra.Rpc.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' -and $_.Name -notlike 'NeoAstra.Rpc.Generator*' } | Select-Object -First 1
          $rpcArchive = [IO.Compression.ZipFile]::OpenRead($rpcPackage.FullName)
          $rpcEntries = $rpcArchive.Entries.FullName
          $rpcArchive.Dispose()
          @('lib/net10.0/NeoAstra.Rpc.dll', 'docs/rpc-and-bindings.md', 'docs/capabilities-and-security.md', 'schemas/neoastra-capabilities-v1.schema.json') | ForEach-Object { if ($_ -notin $rpcEntries) { throw "Missing RPC package asset: $_" } }
          $generatorPackage = Get-ChildItem artifacts/packages/NeoAstra.Rpc.Generator.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $generatorArchive = [IO.Compression.ZipFile]::OpenRead($generatorPackage.FullName)
          $generatorEntries = $generatorArchive.Entries.FullName
          $generatorArchive.Dispose()
          @('analyzers/dotnet/cs/NeoAstra.Rpc.Generator.dll', 'buildTransitive/NeoAstra.Rpc.Generator.targets') | ForEach-Object { if ($_ -notin $generatorEntries) { throw "Missing generator package asset: $_" } }
          $toolPackage = Get-ChildItem artifacts/packages/NeoAstra.Capabilities.Tool.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $toolArchive = [IO.Compression.ZipFile]::OpenRead($toolPackage.FullName)
          $toolEntries = $toolArchive.Entries.FullName
          $toolArchive.Dispose()
          @('tools/net10.0/any/NeoAstra.Capabilities.Tool.dll', 'schemas/neoastra-capabilities-v1.schema.json') | ForEach-Object { if ($_ -notin $toolEntries) { throw "Missing capability tool asset: $_" } }
          $frontendToolPackage = Get-ChildItem artifacts/packages/NeoAstra.Tool.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $frontendToolArchive = [IO.Compression.ZipFile]::OpenRead($frontendToolPackage.FullName)
          $frontendToolEntries = $frontendToolArchive.Entries.FullName
          $frontendToolArchive.Dispose()
          @('tools/net10.0/any/NeoAstra.Tool.dll', 'tools/net10.0/any/DotnetToolSettings.xml', 'schemas/neoastra-project-v1.schema.json') | ForEach-Object { if ($_ -notin $frontendToolEntries) { throw "Missing frontend tool package asset: $_" } }
          $sdkPackage = Get-ChildItem artifacts/packages/NeoAstra.Sdk.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $sdkArchive = [IO.Compression.ZipFile]::OpenRead($sdkPackage.FullName)
          $sdkEntries = $sdkArchive.Entries.FullName
          $sdkArchive.Dispose()
          @('buildTransitive/NeoAstra.Sdk.props', 'buildTransitive/NeoAstra.Sdk.targets', 'tools/net10.0/any/NeoAstra.Tool.dll', 'schemas/neoastra-project-v1.schema.json', 'docs/frontend-tooling-and-assets.md') | ForEach-Object { if ($_ -notin $sdkEntries) { throw "Missing SDK package asset: $_" } }
          $templatePackage = Get-ChildItem artifacts/packages/NeoAstra.Templates.*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          if ($null -eq $templatePackage) { throw 'Missing template package' }
          $templateArchive = [IO.Compression.ZipFile]::OpenRead($templatePackage.FullName)
          $templateEntries = $templateArchive.Entries.FullName
          $templateArchive.Dispose()
          @('content/neoastra-vanilla/.template.config/template.json', 'content/neoastra-react/.template.config/template.json', 'content/neoastra-vue/.template.config/template.json') | ForEach-Object { if ($_ -notin $templateEntries) { throw "Missing template package asset: $_" } }
      - name: Verify managed Source Link
        shell: pwsh
        run: |
          $symbolPackages = @(Get-ChildItem artifacts/packages/*.snupkg)
          if ($symbolPackages.Count -ne 1) { throw "Expected one managed symbol package; found $($symbolPackages.Count)" }
          $commit = git rev-parse HEAD
          & eng/verify_sourcelink.ps1 -SymbolPackage $symbolPackages[0].FullName -Repository xoofx/NeoAstra -Commit $commit
      - name: Generate package checksums
        run: |
          python -m unittest eng.tests.test_release_readiness
          python eng/release_readiness.py checksums --directory artifacts/packages
      - name: Upload package and release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.*nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
