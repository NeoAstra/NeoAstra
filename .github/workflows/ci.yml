name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed:
    name: Managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/NeoWebView.slnx
      - name: Verify generated interop
        shell: bash
        run: |
          dotnet run --project src/NeoWebView.CodeGen/NeoWebView.CodeGen.csproj -c Release --no-restore
          git diff --exit-code -- src/NeoWebView/Generated/Interop/NativeMethods.Generated.cs
      - name: Build
        run: dotnet build src/NeoWebView.slnx -c Release --no-restore
      - name: Test
        run: dotnet test src/NeoWebView.slnx -c Release --no-build

  native-windows:
    name: Native (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            preset: windows-x64-release
            test: true
          - arch: arm64
            preset: windows-arm64-release
            test: false
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        if: matrix.test
        run: ctest --test-dir artifacts/native/${{ matrix.preset }} --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.preset }}
          path: artifacts/native/${{ matrix.preset }}/neowebview_native.dll

  native-macos:
    name: Native (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            preset: macos-arm64-release
          - arch: x64
            runner: macos-15-intel
            preset: macos-x64-release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir artifacts/native/${{ matrix.preset }} --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.preset }}
          path: artifacts/native/${{ matrix.preset }}/libneowebview_native.dylib

  native-linux:
    name: Native (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset linux-x64-release
      - name: Build
        run: cmake --build --preset linux-x64-release
      - name: Test
        run: xvfb-run -a ctest --preset linux-x64-release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-release
          path: artifacts/native/linux-x64-release/libneowebview_native.so

  package:
    name: Package native runtimes
    needs: [managed, native-windows, native-macos, native-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-x64-release
          path: artifacts/native/windows-x64-release
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-arm64-release
          path: artifacts/native/windows-arm64-release
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64-release
          path: artifacts/native/linux-x64-release
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-x64-release
          path: artifacts/native/macos-x64-release
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-arm64-release
          path: artifacts/native/macos-arm64-release
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoWebView.slnx
          dotnet build src/NeoWebView.slnx -c Release --no-restore
          dotnet pack src/NeoWebView/NeoWebView.csproj -c Release --no-build -o artifacts/packages
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @(
            'runtimes/win-x64/native/neowebview_native.dll',
            'runtimes/win-arm64/native/neowebview_native.dll',
            'runtimes/linux-x64/native/libneowebview_native.so',
            'runtimes/osx-x64/native/libneowebview_native.dylib',
            'runtimes/osx-arm64/native/libneowebview_native.dylib'
          ) | ForEach-Object { if ($_ -notin $entries) { throw "Missing package asset: $_" } }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
