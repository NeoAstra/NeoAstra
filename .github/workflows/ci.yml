name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend package and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - name: Verify generated embedded client assets
        run: git diff --exit-code -- samples/NeoAstra.Sample/assets/neoastra-client src/NeoAstra.Conformance/assets/neoastra-client src/NeoAstra.Benchmarks/assets/neoastra-client

  managed:
    name: Managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/NeoAstra.slnx
      - name: Verify generated interop
        shell: bash
        run: |
          dotnet run --project src/NeoAstra.CodeGen/NeoAstra.CodeGen.csproj -c Release --no-restore
          git diff --exit-code -- src/NeoAstra/Generated/Interop/NativeMethods.Generated.cs
      - name: Build
        run: dotnet build src/NeoAstra.slnx -c Release --no-restore
      - name: Verify opt-in harness defaults
        run: |
          dotnet run --project src/NeoAstra.Conformance/NeoAstra.Conformance.csproj -c Release --no-build
          dotnet run --project src/NeoAstra.Benchmarks/NeoAstra.Benchmarks.csproj -c Release --no-build
      - name: Test
        run: dotnet test src/NeoAstra.slnx -c Release --no-build
      - name: Publish NativeAOT sample
        run: dotnet publish samples/NeoAstra.Sample/NeoAstra.Sample.csproj -c Release -r ${{ matrix.rid }} --self-contained -o artifacts/nativeaot

  native:
    uses: ./.github/workflows/native.yml

  package:
    name: Package native runtimes
    needs: [managed, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoAstra/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoAstra/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoAstra/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoAstra/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoAstra/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoAstra/runtimes/osx-arm64/native
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoAstra.slnx
          dotnet build src/NeoAstra.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true
          dotnet pack src/NeoAstra/NeoAstra.csproj -c Release --no-build -o artifacts/packages
          dotnet publish samples/NeoAstra.Sample/NeoAstra.Sample.csproj -c Release -r win-x64 --self-contained -o artifacts/nativeaot
          & artifacts/nativeaot/NeoAstra.Sample.exe --validate-native-library
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @(
            'license.txt',
            'THIRD-PARTY-NOTICES.md',
            'docs/platform-support.md',
            'docs/known-limitations.md',
             'docs/frontend-transport.md',
            'build/native/include/neoastra.h',
            'build/native/include/neoastra_version.h',
            'runtimes/win-x64/native/neoastra_native.dll',
            'runtimes/win-arm64/native/neoastra_native.dll',
            'runtimes/linux-x64/native/libneoastra_native.so',
            'runtimes/linux-arm64/native/libneoastra_native.so',
            'runtimes/osx-x64/native/libneoastra_native.dylib',
            'runtimes/osx-arm64/native/libneoastra_native.dylib'
          ) | ForEach-Object { if ($_ -notin $entries) { throw "Missing package asset: $_" } }
          $symbolPackage = Get-ChildItem artifacts/packages/*.snupkg | Select-Object -First 1
          if ($null -eq $symbolPackage) { throw 'Missing managed symbol package' }
          $symbolArchive = [IO.Compression.ZipFile]::OpenRead($symbolPackage.FullName)
          $symbolEntries = $symbolArchive.Entries.FullName
          $symbolArchive.Dispose()
          if ('lib/net10.0/NeoAstra.pdb' -notin $symbolEntries) { throw 'Missing managed symbols' }
      - name: Verify managed Source Link
        shell: pwsh
        run: |
          $symbolPackages = @(Get-ChildItem artifacts/packages/*.snupkg)
          if ($symbolPackages.Count -ne 1) { throw "Expected one managed symbol package; found $($symbolPackages.Count)" }
          $commit = git rev-parse HEAD
          & eng/verify_sourcelink.ps1 -SymbolPackage $symbolPackages[0].FullName -Repository xoofx/NeoAstra -Commit $commit
      - name: Generate package checksums
        run: |
          python -m unittest eng.tests.test_release_readiness
          python eng/release_readiness.py checksums --directory artifacts/packages
      - name: Upload package and release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.*nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error
