name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed:
    name: Managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Restore
        run: dotnet restore src/NeoWebView.slnx
      - name: Verify generated interop
        shell: bash
        run: |
          dotnet run --project src/NeoWebView.CodeGen/NeoWebView.CodeGen.csproj -c Release --no-restore
          git diff --exit-code -- src/NeoWebView/Generated/Interop/NativeMethods.Generated.cs
      - name: Build
        run: dotnet build src/NeoWebView.slnx -c Release --no-restore
      - name: Test
        run: dotnet test src/NeoWebView.slnx -c Release --no-build

  native:
    uses: ./.github/workflows/native.yml

  package:
    name: Package native runtimes
    needs: [managed, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: src/NeoWebView/runtimes/win-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: src/NeoWebView/runtimes/win-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: src/NeoWebView/runtimes/linux-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: src/NeoWebView/runtimes/linux-arm64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-x64
          path: src/NeoWebView/runtimes/osx-x64/native
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: src/NeoWebView/runtimes/osx-arm64/native
      - name: Build and pack
        shell: pwsh
        run: |
          dotnet restore src/NeoWebView.slnx
          dotnet build src/NeoWebView.slnx -c Release --no-restore
          dotnet pack src/NeoWebView/NeoWebView.csproj -c Release --no-build -o artifacts/packages
      - name: Verify native package assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          @(
            'runtimes/win-x64/native/neowebview_native.dll',
            'runtimes/win-arm64/native/neowebview_native.dll',
            'runtimes/linux-x64/native/libneowebview_native.so',
            'runtimes/linux-arm64/native/libneowebview_native.so',
            'runtimes/osx-x64/native/libneowebview_native.dylib',
            'runtimes/osx-arm64/native/libneowebview_native.dylib'
          ) | ForEach-Object { if ($_ -notin $entries) { throw "Missing package asset: $_" } }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
