name: native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Native hardening (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Linux analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy libclang-rt-dev ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset linux-x64-asan-ubsan
          cmake --build --preset linux-x64-asan-ubsan
          xvfb-run -a ctest --preset linux-x64-asan-ubsan
      - name: Clang static analyzer
        run: |
          cmake --preset linux-x64-analysis
          cmake --build --preset linux-x64-analysis

  thread-sanitizer:
    name: ThreadSanitizer (Linux x64 common code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: ThreadSanitizer selected common-code tests
        run: |
          cmake --preset linux-x64-tsan
          cmake --build --preset linux-x64-tsan
          xvfb-run -a ctest --preset linux-x64-tsan

  macos-sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer (macOS x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build and test with sanitizers
        run: |
          cmake --preset macos-x64-asan-ubsan
          cmake --build --preset macos-x64-asan-ubsan
          ctest --preset macos-x64-asan-ubsan

  build:
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            skip_tests: false
          - rid: win-arm64
            runner: windows-latest
            skip_tests: true
          - rid: osx-x64
            runner: macos-15-intel
            skip_tests: false
          - rid: osx-arm64
            runner: macos-latest
            skip_tests: false
          - rid: linux-x64
            runner: ubuntu-latest
            skip_tests: false
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            skip_tests: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Build, test, and stage native runtime
        shell: bash
        run: |
          args=(--rid "${{ matrix.rid }}" --clean)
          if [[ "${{ matrix.skip_tests }}" == "true" ]]; then args+=(--skip-tests); fi
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.skip_tests }}" != "true" ]]; then
            xvfb-run -a python eng/build_native.py "${args[@]}"
          else
            python eng/build_native.py "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/NeoAstra.Core/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error
      - name: Upload native release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/release-readiness
          if-no-files-found: error
