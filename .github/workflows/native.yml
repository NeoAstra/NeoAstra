name: native

on:
  push:
    paths:
      - 'native/**'
      - 'src/NeoAstra.Core/runtimes/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'eng/build_native.py'
      - 'eng/native/**'
      - 'eng/release_readiness.py'
      - 'src/NeoAstra.Purchases/Apple/**'
      - 'src/NeoAstra.Purchases/xcframework/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/NeoAstra.Core/runtimes/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'eng/build_native.py'
      - 'eng/native/**'
      - 'eng/release_readiness.py'
      - 'src/NeoAstra.Purchases/Apple/**'
      - 'src/NeoAstra.Purchases/xcframework/**'
      - '.github/workflows/native.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    name: Native hardening (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Linux analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy libclang-rt-dev ninja-build libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake --preset linux-x64-asan-ubsan
          cmake --build --preset linux-x64-asan-ubsan
          xvfb-run -a ctest --preset linux-x64-asan-ubsan
      - name: Clang static analyzer
        run: |
          cmake --preset linux-x64-analysis
          cmake --build --preset linux-x64-analysis

  macos-sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer (macOS x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build and test with sanitizers
        run: |
          cmake --preset macos-x64-asan-ubsan
          cmake --build --preset macos-x64-asan-ubsan
          ctest --preset macos-x64-asan-ubsan

  # StoreKit 2 is a Swift API: the purchases plugin embeds this bridge into iOS applications, checked in under
  # src/NeoAstra.Purchases/xcframework like the native libraries.
  purchases-bridge:
    name: StoreKit bridge of the purchases plugin (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the XCFramework
        run: sh src/NeoAstra.Purchases/Apple/build.sh src/NeoAstra.Purchases/Apple/NeoAstraPurchases.swift src/NeoAstra.Purchases/xcframework/NeoAstraPurchases.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: native-purchases-xcframework
          path: src/NeoAstra.Purchases/xcframework/
          if-no-files-found: error

  build:
    name: Native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            skip_tests: false
          - rid: win-arm64
            runner: windows-latest
            skip_tests: true
          - rid: osx-x64
            runner: macos-15-intel
            skip_tests: false
          - rid: osx-arm64
            runner: macos-latest
            skip_tests: false
          # Build the shipped Linux runtimes on the oldest supported glibc (Ubuntu 24.04).
          - rid: linux-x64
            runner: ubuntu-24.04
            skip_tests: false
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            skip_tests: false
          # The mobile libraries cannot run on the build machine, so their tests are the export checks of build_native.py.
          - rid: ios-arm64
            runner: macos-latest
            skip_tests: true
          - rid: iossimulator-arm64
            runner: macos-latest
            skip_tests: true
          - rid: android-arm64
            runner: ubuntu-latest
            skip_tests: true
          - rid: android-x64
            runner: ubuntu-latest
            skip_tests: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # r29 or later keeps the 16 KB page alignment that recent Android versions ask for.
      - name: Set up the Android NDK
        id: ndk
        if: startsWith(matrix.rid, 'android-')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false
      - name: Install Linux dependencies
        if: startsWith(matrix.rid, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - name: Build, test, and stage native runtime
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          args=(--rid "${{ matrix.rid }}" --clean)
          if [[ "${{ matrix.skip_tests }}" == "true" ]]; then args+=(--skip-tests); fi
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.skip_tests }}" != "true" ]]; then
            xvfb-run -a python eng/build_native.py "${args[@]}"
          else
            python eng/build_native.py "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: src/NeoAstra.Core/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error
      - name: Upload native release-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/release-readiness
          if-no-files-found: error
